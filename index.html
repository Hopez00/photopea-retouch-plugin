<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>High-End Retouch</title>
    <style>
        body { 
            background: #222; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 15px; 
            margin: 0;
        }
        h3 { font-size: 16px; margin-bottom: 12px; }
        .btn { 
            width: 100%; 
            padding: 12px; 
            background: #0078d7; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-weight: bold; 
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn:active { background: #005a9e; }
        p { font-size: 12px; color: #aaa; line-height: 1.4; }
    </style>
</head>
<body>
    <h3>High-End Skin Retouching</h3>
    <button class="btn" onclick="runFrequencySeparation()">Apply Frequency Separation</button>
    <p>Splits your active layer into Texture and Tone components for professional skin smoothing.</p>

    <script>
        function runFrequencySeparation() {
            // JavaScript snippet sent directly to Photopea via postMessage
            const script = `
                try {
                    var doc = app.activeDocument;
                    if (!doc) {
                        alert("Please open an image first!");
                    } else {
                        // Create duplicate layers logic for frequency separation
                        app.echoToOE("Setting up High-End Retouch layers...");
                        // Add automation action steps here
                    }
                } catch(e) {
                    alert("Error: " + e.message);
                }
            `;
            window.parent.postMessage(script, "*");
        }
    </script>
</body>
</html>
